name: Generate contribution animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: contribution-animations
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out generator script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download verified Pac-Man library
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from urllib.request import urlopen

          url = "https://raw.githubusercontent.com/abozanona/pacman-contribution-graph/7332e1de7903ab780c3692a4127a59cc13872daa/dist/pacman-contribution-graph.min.js"
          expected = "cf182ee29d0e2bb65f961861fc5ab07585b2b3c54ca34421d4aac8c8dcf1c4f0"
          with urlopen(url, timeout=30) as response:
              data = response.read()
          assert sha256(data).hexdigest() == expected, "Pac-Man library checksum mismatch"
          Path(".github/pacman/pacman-library.mjs").write_bytes(data)
          PY

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: FermataRest
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate Pac-Man SVGs without analytics
        run: node .github/pacman/generate.mjs
        env:
          GITHUB_PROFILE_USERNAME: FermataRest
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify generated SVGs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for name in (
              "github-snake.svg", "github-snake-dark.svg",
              "pacman-contribution-graph.svg", "pacman-contribution-graph-dark.svg",
          ):
              path = Path("dist") / name
              root = ElementTree.fromstring(path.read_bytes())
              assert root.tag == "{http://www.w3.org/2000/svg}svg", f"Invalid SVG: {name}"
              print(f"Verified {name} ({path.stat().st_size:,} bytes)")
          PY

      - name: Upload verified animation files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contribution-animations
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified animation files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contribution-animations
          path: dist

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
