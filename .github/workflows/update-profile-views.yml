name: Update profile views badge

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_profile_views.py
      - .github/workflows/update-profile-views.yml

permissions:
  contents: read

concurrency:
  group: profile-views-badge
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Refresh badge while preserving the last good copy
        run: python3 scripts/update_profile_views.py
      - name: Commit only a changed badge
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/profile-views.svg
          if git diff --cached --quiet -- assets/profile-views.svg; then
            exit 0
          fi
          base_commit="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile views badge" -- assets/profile-views.svg
          if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
            exit 0
          fi
          # Retry after unrelated pushes; never overwrite a newer remote badge.
          git fetch origin "$DEFAULT_BRANCH"
          if ! git diff --quiet "$base_commit" "origin/$DEFAULT_BRANCH" -- assets/profile-views.svg; then
            echo "::warning::Remote badge changed; leaving it untouched until the next refresh."
            exit 0
          fi
          git rebase "origin/$DEFAULT_BRANCH"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
